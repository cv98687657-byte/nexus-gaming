
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS GAMING</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: #f4f3f9;
  text-align: center;
}
.container {
  width: 90%;
}
h1 {
  font-size: 38px;
  color: #111;
}
p {
  font-size: 21px;
}
button {
  background: #20aa4b;
  color: white;
  border: none;
  border-radius: 13px;
  padding: 18px 48px;
  font-size: 22px;
  margin-top: 10px;
}
#status {
  font-size: 17px;
  margin-top: 25px;
}
</style>
</head>
<body>
<div class="container">
  <h1>Welcome</h1>
  <p>Location permission ke liye Allow dabayein.</p>
  <button onclick="getLocation()">Allow Access</button>
  <div id="status"></div>
</div>

<script>
function getLocation() {
  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.textContent = "Location is not supported.";
    return;
  }

  status.textContent = "Waiting for permission...";

  navigator.geolocation.getCurrentPosition(
    function(position) {
      status.textContent =
        "Location permission granted. Demo mein location send ya save nahi hoti.";
    },
    function() {
      status.textContent =
        "Location permission nahi mili.";
    }
  );
}
</script>
</body>
</html>
